:root{--bg-color:#012640;--card-bg:#013255;--primary:#2B7A32;--accent:#6fcf78;--glow:rgba(111,207,120,.4);--text-main:#fff;--text-muted:#b4c6d6;--font-display:'Orbitron',sans-serif;--font-body:'Rajdhani',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.nav-links a:hover,.nav-links a.active{color:var(--accent);text-shadow:0 0 8px var(--glow)}

h1{font:900 5rem/1.1 var(--font-display);text-transform:uppercase;letter-spacing:4px;margin-bottom:1rem}

.motto{font:1.8rem var(--font-display);color:var(--text-muted);letter-spacing:6px;text-transform:uppercase;margin-bottom:3rem}
.btn{display:inline-block;font:700 1rem var(--font-display);text-transform:uppercase;text-decoration:none;letter-spacing:2px;padding:1rem 2.5rem;border-radius:14px;transition:.3s;cursor:pointer}
.btn-primary{background:var(--primary);color:var(--text-main);border:1px solid var(--primary);box-shadow:0 0 20px var(--glow)}

.card,.contact-container{background:var(--card-bg);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2.5rem}
